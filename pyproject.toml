[project]
name = "matchbook-cpp-scripts"
version = "0.1.0"
description = "Benchmark reporting and fixture tooling for matchbook-cpp"
requires-python = ">=3.12"
# The repository environment includes the bindings so examples/ and the
# binding tests run with a plain `uv run` from the repo root.
dependencies = ["pylob"]

[tool.uv.sources]
pylob = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3"]
# Optional plotting stack for examples/; installed by default in the repository
# environment so the examples run with a plain `uv run`, but never a dependency
# of the pylob package itself.
plot = ["matplotlib>=3.11"]

[tool.uv]
package = false
default-groups = ["dev", "plot"]

[tool.uv.workspace]
members = ["python/pylob"]
