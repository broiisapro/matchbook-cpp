# CI runs on GitHub-hosted runners. The macOS jobs take their label list from
# the CI_RUNS_ON repository variable (decision C39); the Linux jobs run on the
# hosted arm64 image directly. The macOS jobs restore ccache and the vcpkg
# binary archives with actions/cache, because every hosted job starts from an
# empty workspace.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # clean: false keeps the persistent workspace on the self-hosted runner,
      # so build/release is incremental across jobs and pushes. Hosted runners
      # start every job with a fresh workspace, where the same setting is a
      # harmless no-op.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (release)
        run: cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (release)
        run: cmake --build --preset release
      - name: ccache statistics
        run: ccache --show-stats

  test:
    name: test
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # Same runner and workspace as `build`: the release build is reused, and
      # only the configure step re-runs (cheap when nothing changed). On a
      # hosted runner this job has its own fresh workspace and rebuilds; that
      # is slower but still correct.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (release)
        run: cmake --preset release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (release)
        run: cmake --build --preset release
      - name: Run tests (release)
        run: ctest --preset release
      - name: Build the Python bindings
        # scikit-build-core builds pylob in an isolated environment with
        # pybind11 from PyPI; --frozen keeps CI on the committed lockfile.
        run: uv sync --frozen
      - name: Run the binding tests
        run: uv run --frozen pytest -q python/pylob/tests
      - name: ccache statistics
        run: ccache --show-stats

  asan:
    name: asan
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (asan)
        run: cmake --preset asan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (asan)
        run: cmake --build --preset asan
      - name: Run tests (asan)
        run: ctest --preset asan
      - name: ccache statistics
        run: ccache --show-stats

  tsan:
    name: tsan
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (tsan)
        run: cmake --preset tsan -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build (tsan)
        run: cmake --build --preset tsan
      - name: Run tests (tsan)
        run: ctest --preset tsan --output-on-failure
      - name: ccache statistics
        run: ccache --show-stats

  linux:
    name: linux
    # Advisory until it has been green on main (decision C55): the arm64 Linux
    # port is checked on every push but does not block a merge while the port
    # is still settling. Hosted arm64 Linux runners are free for public
    # repositories.
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-linux
      - name: Print the toolchain
        run: |
          cmake --version | sed -n 1p
          clang++ --version | sed -n 1p
          ninja --version
          "$VCPKG_ROOT/vcpkg" version | sed -n 1p
      - name: Configure (linux-release)
        run: cmake --preset linux-release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      # The benchmark binary and the SPSC latency harness include the macOS
      # timer in bench/timer.hpp; LOB_BUILD_BENCH=OFF in the preset drops the
      # former, and naming the targets here drops the latter. Everything the
      # test suite executes (the engine, the reference engine, the tools, the
      # wire protocol and the two test binaries) is built.
      - name: Build (linux-release)
        run: cmake --build --preset linux-release --target lobsim lob_tests test_alloc
      - name: Run tests (linux-release)
        run: ctest --preset linux-release
      - name: ccache statistics
        run: ccache --show-stats

  docker:
    name: docker
    # Advisory, like `linux`: the image build exercises the whole Linux port
    # end to end (it compiles the portable targets and runs their tests inside
    # the image) but does not block a merge yet (decision C55).
    #
    # An image rebuild costs several minutes even with a warm layer cache, so a
    # pull request only builds it when it touches a path the image is made of.
    # Pushes to main always build, which is what makes "green on main" true.
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Match the changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR's merge commit; the base commit arrives with
          # a one-commit fetch, so the diff names exactly the PR's files.
          git fetch --no-tags --depth=1 origin "$BASE"
          match=false
          while IFS= read -r path; do
            case "$path" in
              docker/* | .dockerignore | src/* | include/* | net/* | apps/* | tools/* | \
              reference/* | tests/* | CMakeLists.txt | vcpkg.json | \
              .github/workflows/ci.yml | .github/actions/*)
                echo "matched: $path"
                match=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE" HEAD)
          echo "docker=$match" >> "$GITHUB_OUTPUT"
      - name: Set up BuildKit
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build the image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64
          tags: matchbook-cpp:ci
          load: true
          # The build stage compiles the engine and runs its test suite, so a
          # warm layer cache turns the cost of a source change into a
          # recompile instead of an apt install, a vcpkg clone and a port
          # rebuild. mode=max exports the intermediate stages as well as the
          # final image; the layers are large, which the cache's own eviction
          # handles.
          cache-from: type=gha,scope=matchbook-docker
          cache-to: type=gha,mode=max,scope=matchbook-docker,ignore-error=true
      - name: Run lobsim --help in the image
        if: steps.filter.outputs.docker == 'true'
        run: docker run --rm matchbook-cpp:ci --help
      - name: Run a 100k-operation differential test in the image
        if: steps.filter.outputs.docker == 'true'
        run: |
          output="$(docker run --rm matchbook-cpp:ci difftest --ops 100000 --seed 1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -qx 'mismatches: 0'

  format:
    name: format
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # Formatting only reads tracked files; keeping the workspace means this
      # job no longer deletes build/ before the build and test jobs run.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
        with:
          # The formatter and pytest come from uv; this job does not compile
          # anything, so it needs neither vcpkg nor ccache.
          bootstrap-vcpkg: "false"
          ccache: "false"
      - name: Print pinned formatter version
        run: uvx clang-format==23.1.3 --version
      - name: Check formatting
        run: |
          # Tracked source paths never contain spaces, so word splitting is safe here.
          # shellcheck disable=SC2046
          uvx clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.hpp' '*.cpp')
      - name: Run the script tests
        # The report renderer and fixture scripts are part of the deliverable;
        # --frozen keeps CI on the committed lockfile.
        run: uv run --frozen pytest -q scripts/

  tidy:
    name: tidy
    # Advisory and expensive: only a manual dispatch runs it.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
        with:
          # This is the only job that needs Homebrew LLVM; it runs clang-tidy
          # over an existing compile database, never a compiler through ccache.
          install-llvm: "true"
          ccache: "false"
      - name: Configure (release)
        run: cmake --preset release
      - name: Run clang-tidy (advisory)
        run: |
          clang_tidy="$(brew --prefix llvm)/bin/clang-tidy"
          "$clang_tidy" --version
          for source in src/*.cpp; do
            "$clang_tidy" -p build/release "$source"
          done
