# CI runs on one self-hosted runner whose environment forces single-threaded,
# low-priority work (decision C30). The runner label list comes from the
# CI_RUNS_ON repository variable, so switching to GitHub-hosted macOS runners
# at public ship is a variable change rather than a workflow change (decision
# C39).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # clean: false keeps the persistent workspace on the self-hosted runner,
      # so build/release is incremental across jobs and pushes. Hosted runners
      # start every job with a fresh workspace, where the same setting is a
      # harmless no-op.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release

  test:
    name: test
    needs: build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # Same runner and workspace as `build`: the release build is reused, and
      # only the configure step re-runs (cheap when nothing changed). On a
      # hosted runner this job has its own fresh workspace and rebuilds; that
      # is slower but still correct.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release
      - name: Run tests (release)
        run: ctest --preset release

  asan:
    name: asan
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (asan)
        run: cmake --preset asan
      - name: Build (asan)
        run: cmake --build --preset asan
      - name: Run tests (asan)
        run: ctest --preset asan

  format:
    name: format
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      # Formatting only reads tracked files; keeping the workspace means this
      # job no longer deletes build/ before the build and test jobs run.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
        with:
          # The formatter comes from uv; this job does not build anything, so
          # it does not need vcpkg.
          bootstrap-vcpkg: "false"
      - name: Print pinned formatter version
        run: uvx clang-format==23.1.3 --version
      - name: Check formatting
        run: |
          # Tracked source paths never contain spaces, so word splitting is safe here.
          # shellcheck disable=SC2046
          uvx clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.hpp' '*.cpp')

  tidy:
    name: tidy
    # Advisory and expensive: only a manual dispatch runs it.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
        with:
          # This is the only job that needs Homebrew LLVM.
          install-llvm: "true"
      - name: Configure (release)
        run: cmake --preset release
      - name: Run clang-tidy (advisory)
        run: |
          clang_tidy="$(brew --prefix llvm)/bin/clang-tidy"
          "$clang_tidy" --version
          for source in src/*.cpp; do
            "$clang_tidy" -p build/release "$source"
          done
