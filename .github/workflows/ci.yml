# CI runs on one self-hosted runner whose environment forces single-threaded,
# low-priority work. Checkouts keep the runner's persistent workspace
# (`clean: false`) so `build/<preset>` survives across jobs and pushes and
# re-runs are incremental; `test` reuses the `build` job's release build.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      # clean: false keeps the persistent workspace, so build/release is
      # incremental across jobs and pushes.
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Bootstrap vcpkg
        run: |
          echo "VCPKG_ROOT=$HOME/.cache/matchbook/vcpkg" >> "$GITHUB_ENV"
          ./scripts/bootstrap_vcpkg.sh
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release

  test:
    name: test
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      # Same runner and workspace as `build`: the release build is reused, and
      # only the configure step re-runs (cheap when nothing changed).
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Bootstrap vcpkg
        run: |
          echo "VCPKG_ROOT=$HOME/.cache/matchbook/vcpkg" >> "$GITHUB_ENV"
          ./scripts/bootstrap_vcpkg.sh
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release
      - name: Run tests (release)
        run: ctest --preset release

  asan:
    name: asan
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Bootstrap vcpkg
        run: |
          echo "VCPKG_ROOT=$HOME/.cache/matchbook/vcpkg" >> "$GITHUB_ENV"
          ./scripts/bootstrap_vcpkg.sh
      - name: Configure (asan)
        run: cmake --preset asan
      - name: Build (asan)
        run: cmake --build --preset asan
      - name: Run tests (asan)
        run: ctest --preset asan

  format:
    name: format
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Print pinned formatter version
        run: uvx clang-format==23.1.3 --version
      - name: Check formatting
        run: |
          # Tracked source paths never contain spaces, so word splitting is safe here.
          # shellcheck disable=SC2046
          uvx clang-format==23.1.3 --dry-run --Werror $(git ls-files '*.hpp' '*.cpp')

  tidy:
    name: tidy
    # Advisory and expensive: only a manual dispatch runs it.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Bootstrap vcpkg
        run: |
          echo "VCPKG_ROOT=$HOME/.cache/matchbook/vcpkg" >> "$GITHUB_ENV"
          ./scripts/bootstrap_vcpkg.sh
      - name: Configure (release)
        run: cmake --preset release
      - name: Run clang-tidy (advisory)
        run: |
          clang_tidy="$(brew --prefix llvm)/bin/clang-tidy"
          "$clang_tidy" --version
          for source in src/*.cpp; do
            "$clang_tidy" -p build/release "$source"
          done
