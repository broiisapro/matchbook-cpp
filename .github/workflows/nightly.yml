name: nightly

on:
  # 06:00 UTC is 02:00 in Toronto during daylight saving time (01:00 EST in
  # winter), i.e. the middle of the Toronto night.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ops:
        description: "operations per narrow-config run"
        required: false
        default: "2000000"
        type: string
      wide_ops:
        description: "operations per wide-config run"
        required: false
        default: "200000"
        type: string
      seeds:
        description: "number of seeds to run"
        required: false
        default: "5"
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  difftest:
    name: long difftest
    # Not part of the required checks: only the schedule and a manual dispatch
    # start this workflow, never a pull request or a push.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    # Both presets, both configs, both type mixes and five seeds are expected
    # to finish well inside forty minutes; the timeout is headroom for a busy
    # machine. The wide config gets its own, lower op count because the
    # harness compares full-book digests after every operation and the wide
    # books are deep. Every run with --types all roughly doubles the op count
    # of the corresponding basic run.
    timeout-minutes: 90
    steps:
      # clean: false keeps the runner's persistent workspace, so both preset
      # builds are incremental whenever a previous run left them in place. A
      # hosted runner starts every job with a fresh workspace, where the same
      # setting is a harmless no-op.
      - uses: actions/checkout@v7
        with:
          clean: false
      - uses: ./.github/actions/setup
      - name: Configure (release)
        run: cmake --preset release
      - name: Build (release)
        run: cmake --build --preset release
      - name: Configure (release-tree)
        run: cmake --preset release-tree
      - name: Build (release-tree)
        run: cmake --build --preset release-tree
      - name: Run long differential tests
        env:
          OPS: ${{ inputs.ops || '2000000' }}
          WIDE_OPS: ${{ inputs.wide_ops || '200000' }}
          SEEDS: ${{ inputs.seeds || '5' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          [[ "$OPS" =~ ^[0-9]+$ ]] || { echo "nightly: ops must be an integer" >&2; exit 2; }
          [[ "$WIDE_OPS" =~ ^[0-9]+$ ]] || { echo "nightly: wide_ops must be an integer" >&2; exit 2; }
          [[ "$SEEDS" =~ ^[0-9]+$ ]] || { echo "nightly: seeds must be an integer" >&2; exit 2; }
          (( SEEDS >= 1 )) || { echo "nightly: seeds must be at least 1" >&2; exit 2; }

          # Seeds are derived from the workflow run id so every nightly uses a
          # fresh stream, and the exact seeds are printed for reproduction.
          seeds=()
          for ((i = 0; i < SEEDS; ++i)); do
            seeds+=("$(( (RUN_ID + i * 7919) % 1000000007 + 1 ))")
          done
          echo "nightly: ops=$OPS wide_ops=$WIDE_OPS seeds=${seeds[*]}"

          # Each seed runs both configs against both ladders, once with the
          # default (basic) submit types and once with --types all, which adds
          # FOK and PostOnly submits. The summary prints the config name and
          # the max sampled depth.
          for seed in "${seeds[@]}"; do
            for preset in release release-tree; do
              echo "nightly: preset=$preset config=narrow seed=$seed types=basic"
              ./build/$preset/lobsim difftest --ops "$OPS" --seed "$seed" --config narrow
              echo "nightly: preset=$preset config=narrow seed=$seed types=all"
              ./build/$preset/lobsim difftest --ops "$OPS" --seed "$seed" --config narrow --types all
              echo "nightly: preset=$preset config=wide seed=$seed types=basic"
              ./build/$preset/lobsim difftest --ops "$WIDE_OPS" --seed "$seed" --config wide
              echo "nightly: preset=$preset config=wide seed=$seed types=all"
              ./build/$preset/lobsim difftest --ops "$WIDE_OPS" --seed "$seed" --config wide --types all
            done
          done
